<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Skew · private</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0e1a2b" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: #0e1a2b; color: #dde7f3; font: 14px/1.4 -apple-system, system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }

  #header { padding: 6px 12px; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #1f3a5a; }
  #header h1 { margin: 0; font-size: 13px; color: #6ea8ff; font-weight: 600; }
  #wind-src { font-size: 11px; color: #8fb3df; }

  #cards { display: flex; flex-direction: column; gap: 1px; background: #1f3a5a; }
  .card { background: #102236; padding: 8px 12px; }
  .card .label { font-size: 10px; color: #8fb3df; text-transform: uppercase; letter-spacing: 0.5px; }
  .card .value { font-size: 22px; font-weight: 700; line-height: 1.1; margin-top: 2px; letter-spacing: -0.5px; }
  .card .tag { font-size: 11px; color: #c5d8ee; margin-top: 2px; }
  .value.green { color: #22c55e; }
  .value.amber { color: #f59e0b; }
  .value.red { color: #ef4444; }
  .value.gray { color: #6f8aa8; }

  #map { flex: 1; min-height: 200px; background: #16263a; }

  #suggested {
    padding: 8px 12px; background: #0a1d12; border-top: 1px solid #1c4030;
    font-size: 13px; color: #a3e3a3; text-align: center; min-height: 1.4em;
  }

  #buttons {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
    background: #1f3a5a;
  }
  #buttons button {
    background: #1c3653; color: #fff; border: 0; padding: 12px 0;
    font-size: 12px; font-weight: 600; cursor: pointer; min-height: 52px;
  }
  #buttons button:active { background: #264168; }
  #buttons .pinned { background: #2a6c41; }

  #controls {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px;
    background: #1f3a5a;
  }
  #controls button {
    background: #1c3653; color: #fff; border: 0; padding: 10px 0;
    font-size: 12px; font-weight: 500; cursor: pointer;
  }
  #controls .reset { background: #4d1f1f; }

  #wind-controls {
    padding: 8px 12px; background: #0e1a2b; border-top: 1px solid #1f3a5a;
    display: flex; gap: 8px; align-items: center; font-size: 12px;
  }
  #wind-controls label { color: #8fb3df; }
  #wind-controls select, #wind-controls input {
    background: #16263a; color: #dde7f3; border: 1px solid #2a4263;
    border-radius: 4px; padding: 4px 6px; font: inherit;
  }
  #wind-controls input[type=number] { width: 56px; }

  .pin-marker {
    background: #facc15; color: #0f1924; font-weight: 700; font-size: 11px;
    border: 2px solid #0f1924; border-radius: 50%;
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.6);
  }
  .pin-marker.W { background: #ef4444; color: #fff; }
  .pin-marker.L { background: #22c55e; color: #fff; }
  .pin-marker.CB { background: #facc15; color: #0f1924; }
  .pin-marker.P  { background: #22d3ee; color: #0f1924; }
</style>
</head>
<body>

<div id="header">
  <h1>Skew · private</h1>
  <div id="wind-src">wind: —</div>
</div>

<div id="cards">
  <div class="card">
    <div class="label">Windward-mark side bias</div>
    <div class="value gray" id="wmsBias">—°</div>
    <div class="tag" id="wmsTag">pin CB + Pin + W to compute</div>
  </div>
  <div class="card">
    <div class="label">Start-line bias</div>
    <div class="value gray" id="lineBias">—°</div>
    <div class="tag" id="lineTag">pin CB + Pin to compute</div>
  </div>
  <div class="card">
    <div class="label">Course skew (L → W)</div>
    <div class="value gray" id="courseSkew">—°</div>
    <div class="tag" id="courseTag">pin L + W to compute</div>
  </div>
</div>

<div id="map"></div>

<div id="suggested">—</div>

<div id="wind-controls">
  <label>Wind:</label>
  <select id="windSrc">
    <option value="hko">HKO live</option>
    <option value="manual">Manual</option>
  </select>
  <input id="manualTwd" type="number" min="0" max="359" placeholder="TWD°" hidden />
  <input id="manualSpd" type="number" min="0" max="60" placeholder="kn" hidden />
</div>

<div id="buttons">
  <button id="pinCB">📍 CB</button>
  <button id="pinP">📍 Pin</button>
  <button id="pinW">📍 W</button>
  <button id="pinL">📍 L</button>
</div>
<div id="controls">
  <button id="locate">🎯 Centre map</button>
  <button id="reset" class="reset">Clear all pins</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="skew.js"></script>
</body>
</html>
